const $=s=>document.querySelector(s);let S={},n0=0;
try{S=JSON.parse(localStorage.getItem("sel2")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("sel2",JSON.stringify(S))}catch(e){}};
const all=c=>c.gs.flatMap(g=>g.it);
D.forEach((c,ci)=>{
 c.gs=c.g.map(([h,s,ko])=>({h,it:s.split(";").map(p=>{const j=p.lastIndexOf(":"),q=p.slice(0,j),w=q.indexOf("~");return{id:"i"+n0++,n:w<0?q:q.slice(0,w),d:w<0?"":q.slice(w+1),g:+p.slice(j+1),k:ko||c.k||"have"}})}));
 let h,el;
 if(!c.gs.length){el=document.createElement("div");el.className="line";h=`<b>${c.t}</b>${c.note?`<span class="nt">${c.note}</span>`:""}`}
 else{el=document.createElement("details");el.open=true;
  h=`<summary><b>${c.t}</b>${c.note?`<span class="nt">${c.note}</span>`:""}<span class="m" id="m${ci}"></span></summary>${all(c).some(x=>x.k=="have")?`<div class="bar"><button data-a="1" data-c="${ci}">全部勾選</button><button data-a="0" data-c="${ci}">全部取消</button></div>`:""}`;
  c.gs.forEach(g=>{if(g.h)h+=`<div class="gh">${g.h}</div>`;h+=g.it.map(x=>`<label class="it ${x.k}">${x.k=="have"?`<input type="checkbox" id="${x.id}" ${S[x.id]?"checked":""}>`:`<i class="b">•</i>`}<span>${x.n}${x.d?`<small>${x.d}</small>`:""}</span><em>${x.g?x.g+" GB":"—"}</em></label>`).join("")})}
 el.innerHTML=h;$("#list").append(el)});
function upd(){let rn=0,rg=0,an=0;
 D.forEach((c,ci)=>{const I=all(c);if(!I.length)return;const on=I.filter(x=>S[x.id]),g=on.reduce((a,x)=>a+x.g,0),t=I.reduce((a,x)=>a+x.g,0);
  on.forEach(x=>{if(x.k=="rec")an++;else{rn++;rg+=x.g}});
  $("#m"+ci).textContent=(t?`共約 ${t.toFixed(1)} GB・`:"")+(I[0].k!="have"?"":`標記移除 ${on.length}/${I.length} 項${g?`・${g.toFixed(1)} GB`:""}`)});
 $("#st").textContent=`標記移除 ${rn} 項・約 ${rg.toFixed(1)} GB`+(an?`・想新增 ${an} 項`:"")}
$("#list").addEventListener("change",e=>{const id=e.target.id;if(e.target.checked)S[id]=1;else delete S[id];save();upd()});
$("#list").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;all(D[b.dataset.c]).filter(x=>x.k=="have").forEach(x=>{if(b.dataset.a=="1")S[x.id]=1;else delete S[x.id];document.getElementById(x.id).checked=b.dataset.a=="1"});save();upd()});
$("#gen").onclick=()=>{
 const o=["【音源庫確認回覆】"+$("#who").value.trim()];
 const sec=(k,t)=>{const L=[];let g=0;D.forEach(c=>{const s=all(c).filter(x=>S[x.id]&&x.k==k);if(s.length){L.push("◆ "+c.t.replace(/[✅⬜]\s*/g,""));s.forEach(x=>{L.push("  - "+x.n.replace(/^✅\s*/,"")+(x.g?`（${x.g} GB）`:""));g+=x.g})}});o.push("",t+(L.length?`（約 ${g.toFixed(1)} GB）`:"：無"),...L)};
 sec("have","■ 一定用不到，可移除");
 const n=$("#note").value.trim();if(n)o.push("","■ 備註",n);
 $("#out").value=o.join("\n");$("#res").hidden=false;$("#res").scrollIntoView({behavior:"smooth"})};
